name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - name: Build app
        run: pnpm build
      - name: Electron smoke test (real runtime, native modules)
        run: |
          xvfb-run -a node_modules/electron/dist/electron apps/desktop --no-sandbox --smoke-test=$RUNNER_TEMP/smoke.json
          cat $RUNNER_TEMP/smoke.json
      - name: UI end-to-end — Phase 1 foundation (Playwright + Electron)
        run: xvfb-run -a node apps/desktop/e2e/foundation.e2e.mjs
      - name: UI end-to-end — Phase 2 20-step scenario incl. restart (Playwright + Electron)
        run: xvfb-run -a node apps/desktop/e2e/phase2.e2e.mjs
      - name: UI end-to-end — ticket-office operations workflow at 1366x768 (Playwright + Electron)
        run: xvfb-run -a node apps/desktop/e2e/operations.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: |
            apps/desktop/out/e2e-screenshots
            apps/desktop/out/e2e-phase2
            apps/desktop/out/e2e-operations
          retention-days: 7

  windows:
    name: Windows installer, packaged app, setup, uninstall/reinstall
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit + integration tests on Windows
        run: pnpm test
      - name: Build NSIS installer (development build, unsigned)
        run: pnpm dist:win
      - name: Signing gate — a release build without credentials fails clearly
        shell: pwsh
        run: |
          $env:AIRDESK_REQUIRE_SIGNING = '1'
          $msg = node apps/desktop/scripts/signing.mjs 2>&1
          if ($LASTEXITCODE -eq 0) { throw 'The signing gate accepted a release build without credentials' }
          if ("$msg" -notmatch 'no signing credentials') { throw "Unclear signing error: $msg" }
          Write-Host "Refused as expected: $msg"
      - name: Upgrade path — build and install 1.0.0-rc.1, create unencrypted data
        shell: pwsh
        run: |
          git fetch --depth=1 origin 59c3634ef0c707a1825646fb8e39336dda34f909
          git worktree add "$env:RUNNER_TEMP\rc1" 59c3634ef0c707a1825646fb8e39336dda34f909
          Push-Location "$env:RUNNER_TEMP\rc1"
          pnpm install --frozen-lockfile
          pnpm dist:win
          $old = Get-ChildItem apps/desktop/dist/AirDesk-Setup-*-x64.exe | Select-Object -First 1
          Start-Process -FilePath $old.FullName -ArgumentList '/S', '/allusers' -Wait
          Pop-Location
          $out = "$env:RUNNER_TEMP\rc1-seed.json"
          Start-Process -FilePath "$env:ProgramFiles\AirDesk\AirDesk.exe" -ArgumentList "--smoke-test=$out", '--smoke-phase=seed', "--smoke-data-dir=$env:ProgramData\AirDesk\data" -Wait
          Get-Content $out
          if (-not (Get-Content $out | ConvertFrom-Json).ok) { throw 'rc.1 seed failed' }
      - name: Upgrade path — install the new version over rc.1, data opens, encryption enabled in place
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/dist/AirDesk-Setup-*-x64.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S', '/allusers' -Wait
          $out = "$env:RUNNER_TEMP\upgrade.json"
          Start-Process -FilePath "$env:ProgramFiles\AirDesk\AirDesk.exe" -ArgumentList "--smoke-test=$out", '--smoke-phase=upgrade', "--smoke-data-dir=$env:ProgramData\AirDesk\data" -Wait
          Get-Content $out
          if (-not (Get-Content $out | ConvertFrom-Json).ok) { throw 'Upgrade from rc.1 failed' }
          Start-Process -FilePath "$env:ProgramFiles\AirDesk\Uninstall AirDesk.exe" -ArgumentList '/S', '/allusers' -Wait
          Start-Sleep -Seconds 5
          # Back to a clean machine for the fresh-install checks below.
          Remove-Item -Recurse -Force "$env:ProgramData\AirDesk" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:APPDATA\AirDesk" -ErrorAction SilentlyContinue
      - name: Silent install
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/dist/AirDesk-Setup-*-x64.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S', '/allusers' -Wait
          if (-not (Test-Path "$env:ProgramFiles\AirDesk\AirDesk.exe")) { throw 'AirDesk.exe not installed' }
      - name: Version information (EXE file properties, installer, Apps & Features entry)
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          $exe = (Get-Item "$env:ProgramFiles\AirDesk\AirDesk.exe").VersionInfo
          $exe | Format-List ProductName, ProductVersion, FileVersion, FileDescription, CompanyName, LegalCopyright
          if ($exe.ProductName -ne 'AirDesk') { throw "EXE ProductName is '$($exe.ProductName)'" }
          # Windows resources hold numeric versions (1.0.0.x); the full semver is in the Apps & Features entry.
          $numeric = $version -replace '-.*$', ''
          if (-not $exe.ProductVersion.StartsWith($numeric)) { throw "EXE ProductVersion '$($exe.ProductVersion)' does not match $version" }
          $installer = (Get-ChildItem apps/desktop/dist/AirDesk-Setup-*-x64.exe | Select-Object -First 1).VersionInfo
          $installer | Format-List ProductName, ProductVersion, FileVersion
          if ($installer.ProductName -ne 'AirDesk') { throw 'Installer ProductName is not AirDesk' }
          $entry = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like 'AirDesk*' } | Select-Object -First 1
          if (-not $entry) { throw 'No Apps & Features entry for AirDesk' }
          $entry | Format-List DisplayName, DisplayVersion, Publisher, InstallLocation
          if ($entry.DisplayVersion -ne $version) { throw "Apps & Features version '$($entry.DisplayVersion)' <> $version" }
      - name: Packaged launch on a clean PC waits for setup and writes no unencrypted data
        shell: pwsh
        run: |
          $data = "$env:ProgramData\AirDesk\data"
          $db = "$data\airdesk.db"
          if (Test-Path $db) { throw 'Runner is not clean: database already exists' }
          $p = Start-Process -FilePath "$env:ProgramFiles\AirDesk\AirDesk.exe" -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          while (-not (Test-Path "$data\logs") -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "AirDesk exited early with code $($p.ExitCode)" }
          if (Test-Path $db) { throw 'A database was created before first-run setup (it must be created encrypted by setup)' }
          Stop-Process -Id $p.Id -Force
          Get-Process AirDesk -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          Get-ChildItem $data
      - name: ProgramData permissions (standard Windows users can run AirDesk)
        shell: pwsh
        run: |
          $acl = icacls "$env:ProgramData\AirDesk"
          $acl
          if (-not ($acl -match 'BUILTIN\\Users:.*\(M\)|BUILTIN\\Users:\(OI\)\(CI\)\(M\)')) { throw 'Users do not have modify rights on %ProgramData%\AirDesk' }
      - name: Packaged smoke test (native SQLite + Argon2, setup, login, master data, ticket record + payment, backup, restore, restart)
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\smoke.json"
          Start-Process -FilePath "$env:ProgramFiles\AirDesk\AirDesk.exe" -ArgumentList "--smoke-test=$out" -Wait
          Get-Content $out
          if (-not (Get-Content $out | ConvertFrom-Json).ok) { throw 'Smoke test failed' }
      - name: First-run setup + login + master data in the REAL data directory
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\seed.json"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\offsite" | Out-Null
          Start-Process -FilePath "$env:ProgramFiles\AirDesk\AirDesk.exe" -ArgumentList "--smoke-test=$out", '--smoke-phase=seed', "--smoke-data-dir=$env:ProgramData\AirDesk\data", "--smoke-backup-out=$env:RUNNER_TEMP\offsite" -Wait
          Get-Content $out
          if (-not (Get-Content $out | ConvertFrom-Json).ok) { throw 'Seed failed' }
          if (-not (Test-Path "$env:APPDATA\AirDesk\device-keys\*.key")) { throw 'No DPAPI-protected device key was saved' }
      - name: Uninstall keeps company data
        shell: pwsh
        run: |
          Start-Process -FilePath "$env:ProgramFiles\AirDesk\Uninstall AirDesk.exe" -ArgumentList '/S', '/allusers' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path "$env:ProgramFiles\AirDesk\AirDesk.exe") { throw 'Uninstall did not remove the program' }
          if (-not (Test-Path "$env:ProgramData\AirDesk\data\airdesk.db")) { throw 'Company database was removed by uninstall' }
      - name: Reinstall and verify the preserved data (no second setup, login works, records intact)
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/dist/AirDesk-Setup-*-x64.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S', '/allusers' -Wait
          $out = "$env:RUNNER_TEMP\verify.json"
          Start-Process -FilePath "$env:ProgramFiles\AirDesk\AirDesk.exe" -ArgumentList "--smoke-test=$out", '--smoke-phase=verify', "--smoke-data-dir=$env:ProgramData\AirDesk\data" -Wait
          Get-Content $out
          if (-not (Get-Content $out | ConvertFrom-Json).ok) { throw 'Data verification after reinstall failed' }
          Start-Process -FilePath "$env:ProgramFiles\AirDesk\Uninstall AirDesk.exe" -ArgumentList '/S', '/allusers' -Wait
      - name: Clean-PC disaster recovery (no data, no device key; encrypted off-site backup + recovery passphrase)
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5
          Remove-Item -Recurse -Force "$env:ProgramData\AirDesk" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:APPDATA\AirDesk" -ErrorAction SilentlyContinue
          $installer = Get-ChildItem apps/desktop/dist/AirDesk-Setup-*-x64.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S', '/allusers' -Wait
          $backup = Get-ChildItem "$env:RUNNER_TEMP\offsite\*.adbk" | Select-Object -First 1
          if (-not $backup) { throw 'No off-site backup was written' }
          $out = "$env:RUNNER_TEMP\recover.json"
          Start-Process -FilePath "$env:ProgramFiles\AirDesk\AirDesk.exe" -ArgumentList "--smoke-test=$out", '--smoke-phase=recover', "--smoke-data-dir=$env:ProgramData\AirDesk\data", "--smoke-backup=$($backup.FullName)" -Wait
          Get-Content $out
          if (-not (Get-Content $out | ConvertFrom-Json).ok) { throw 'Clean-PC recovery failed' }
          Start-Process -FilePath "$env:ProgramFiles\AirDesk\Uninstall AirDesk.exe" -ArgumentList '/S', '/allusers' -Wait
      - uses: actions/upload-artifact@v4
        with:
          name: AirDesk-Setup-windows-x64
          path: apps/desktop/dist/AirDesk-Setup-*-x64.exe
          retention-days: 14
