# Windows packaging (Phase 0 §11). Per-machine NSIS installer; data lives in
# %ProgramData%\AirDesk and is NEVER removed by uninstall.
appId: com.airdesk.desktop
productName: AirDesk
copyright: Copyright © AirDesk
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
asarUnpack:
  - "**/*.node"
npmRebuild: false  # native deps ship N-API prebuilds for win32-x64; nothing to rebuild
buildDependenciesFromSource: false
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: AirDesk-Setup-${version}-x64.${ext}
  # Writes product name, version and copyright into AirDesk.exe (Windows file
  # properties). Without a certificate (CSC_LINK) signing itself is skipped:
  # code signing is configured only in the protected release workflow.
  signAndEditExecutable: true
  legalTrademarks: AirDesk
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AirDesk
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
# No update feed yet: offline installer distribution only (online updates: Phase 10).
publish: []
